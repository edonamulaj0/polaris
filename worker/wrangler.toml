name = "polaris-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "polaris-db"
database_id = "6cd23fd0-992f-4af3-ab5e-4e5a622df0c9"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "d973d66b243d4f20a56c9b9e84488485"
preview_id = "e8656e3ee5f04154a3ed2058cecbf7f1"

[ai]
binding = "AI"

[triggers]
crons = ["0 */6 * * *"]

# Secrets (set from worker/ directory):
#   npx wrangler secret put GUARDIAN_API_KEY
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put EDITOR_SESSION_SECRET

# Optional email binding for ban notifications:
# [[send_email]]
# name = "EMAIL"
# [vars]
# EMAIL_FROM = "moderation@yourdomain.com"

[vars]
ENVIRONMENT = "production"
