# [WRK-6] Wrangler config for Cloudflare Worker + Pages integration
name = "polaris-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "polaris-db"
database_id = "6cd23fd0-992f-4af3-ab5e-4e5a622df0c9"

# Workers AI binding
[ai]
binding = "AI"

# Cron trigger — runs every 6 hours to ingest new articles
[triggers]
crons = ["0 */6 * * *"]

[[routes]]
pattern = "polaris.pages.dev/api*"
zone_name = "polaris.pages.dev"

# Environment variables (set in Cloudflare dashboard, not here)
# GUARDIAN_API_KEY — from guardian.com/open-platform (free)
# GOOGLE_CLIENT_ID — same as VITE_GOOGLE_CLIENT_ID in frontend

[vars]
ENVIRONMENT = "production"
